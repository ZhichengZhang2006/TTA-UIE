project: pr_tta_v1
seed: 2026
hardware: cuda
data:
  root: /home/user/UnderWaterDataset/LSUI
  manifest: manifests/manifest.csv
  split_targets: {train: 3000, tune: 300, utility_fit: 650, risk_calib: 329}
  manifest_workers: 12
  loader_workers: 8
  cache: manifests/rgb256
input:
  shape: [3, 256, 256]
  range: [0.0, 1.0]
  alignment: resize_square_256
  physics_linear_rgb: true
static:
  backbone: unet4
  channels: [32, 64, 128, 256]
  norm: group_norm
  adapter:
    type: low_rank_1x1
    rank: 4
    alpha: 4
    positions: [decoder_stage2, decoder_stage3]
  train:
    epochs: 200
    batch_size: 8
    grad_accum: 2
    optimizer: adamw
    lr: 0.0002
    min_lr: 0.000001
    warmup_epochs: 5
    weight_decay: 0.0001
    amp: bf16
    grad_clip: 1.0
    loss_l1: 1.0
    loss_ssim: 0.2
physics:
  first_estimator: udcp
  hypotheses: 1
  dark_patch: 15
  omega: 0.95
  t_clip: [0.05, 0.98]
  charbonnier_eps: 0.001
  min_confidence_mean: 0.05
candidate:
  steps: 1
  optimizer: manual_normalized_sgd
  eta: 0.0003
  output_drift_rms_max: 0.0156862745
  max_backtracking: 3
e1:
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  max_images: 200
  output_probe_pixel_steps: [1, 2, 4]
  low_transmission_threshold: 0.2
  harmful_thresholds_db: [0.0, 0.2, 0.5]
  failure_examples: 6
  output: results/e1_gradient_audit.csv
  report: reports/E1_findings.md
paths:
  checkpoints: checkpoints
  results: results
smoke:
  steps: 8
  batch_size: 8
